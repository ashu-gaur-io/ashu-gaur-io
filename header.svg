<svg viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aromea Cafe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d16"/>
      <stop offset="1" stop-color="#4a3226"/>
    </linearGradient>
    <style>
      .fade{opacity:0;animation:fade 1.3s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .steam{fill:none;stroke:#f3e3d0;stroke-width:5;stroke-linecap:round;opacity:0;animation:steam 4s ease-in-out infinite}
      .s2{animation-delay:1.3s}.s3{animation-delay:2.6s}
      @keyframes steam{0%{opacity:0;transform:translateY(14px)}35%{opacity:.7}100%{opacity:0;transform:translateY(-18px)}}
      .bob{animation:bob 6s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="900" height="270" rx="22" fill="url(#bg)"/>
  <circle class="bob" cx="780" cy="40" r="60" fill="#d98c63" opacity=".12"/>
  <circle class="bob" cx="120" cy="250" r="80" fill="#d98c63" opacity=".1"/>

  <!-- cup -->
  <g transform="translate(690,70)"><g class="fade d1">
    <path class="steam" d="M40 40 q-10 -20 0 -35 q10 -15 0 -30"/>
    <path class="steam s2" d="M70 40 q-10 -20 0 -35 q10 -15 0 -30"/>
    <path class="steam s3" d="M100 40 q-10 -20 0 -35 q10 -15 0 -30"/>
    <path d="M20 60 h110 v50 a45 45 0 0 1 -45 45 h-20 a45 45 0 0 1 -45 -45 z" fill="#f3e3d0"/>
    <path d="M130 75 h14 a22 22 0 0 1 0 44 h-22" fill="none" stroke="#f3e3d0" stroke-width="9"/>
    <rect x="12" y="170" width="126" height="9" rx="4.5" fill="#d98c63"/>
  </g></g>

  <g class="fade d2">
    <text x="50" y="120" font-family="Georgia, serif" font-size="82" font-weight="700" letter-spacing="-2" fill="#f7ede1">Aromea</text>
    <text x="52" y="162" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#e8b48f">cafe &amp; reservations</text>
  </g>

  <g class="fade d3" font-family="monospace" font-size="13">
    <rect x="52" y="190" width="108" height="30" rx="15" fill="#f3e3d0" opacity=".14"/>
    <text x="106" y="210" text-anchor="middle" fill="#f3e3d0">Order online</text>
    <rect x="172" y="190" width="112" height="30" rx="15" fill="#f3e3d0" opacity=".14"/>
    <text x="228" y="210" text-anchor="middle" fill="#f3e3d0">Book a table</text>
    <rect x="296" y="190" width="116" height="30" rx="15" fill="#f3e3d0" opacity=".14"/>
    <text x="354" y="210" text-anchor="middle" fill="#f3e3d0">High protein</text>
  </g>
</svg>
