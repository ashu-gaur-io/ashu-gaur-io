<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashutosh Gaur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6efe6"/><stop offset="1" stop-color="#e6efe9"/></linearGradient>
    <style>
      .fade{opacity:0;animation:fade 1.3s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 9s ease-in-out infinite reverse}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      .br{animation:br 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes br{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
    </style>
  </defs>
  <rect width="900" height="320" rx="22" fill="url(#bg)"/>
  <circle class="f1" cx="470" cy="70" r="46" fill="#f2c9b1" opacity=".45"/>
  <circle class="f2" cx="520" cy="250" r="64" fill="#b9d3c4" opacity=".4"/>
  <circle class="f1" cx="90" cy="290" r="30" fill="#c9d6ee" opacity=".45"/>
  <g class="fade d1">
    <text x="40" y="44" font-family="monospace" font-size="12" fill="#4a5a52">ashu-gaur-io</text>
    <text x="860" y="44" font-family="monospace" font-size="11" letter-spacing="1.5" text-anchor="end" fill="#4a5a52">MUMBAI, INDIA</text>
    <line x1="40" y1="58" x2="860" y2="58" stroke="#cfd8d0"/>
  </g>
  <g class="fade d2">
    <text x="40" y="165" font-family="Georgia, serif" font-size="80" font-weight="700" letter-spacing="-2" fill="#2f3e46">Ashutosh</text>
    <text x="40" y="245" font-family="Georgia, serif" font-style="italic" font-size="80" fill="#d98c63">Gaur</text>
  </g>
  <g class="fade d3">
    <rect x="570" y="82" width="290" height="176" rx="16" fill="#2f3e46"/>
    <text x="592" y="110" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#9bb0a5">WHAT I WORK ON</text>
    <text x="592" y="142" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Data Structures &amp; Algorithms</text>
    <text x="592" y="160" font-family="monospace" font-size="10" fill="#9bb0a5">C++ · LeetCode · Problem solving</text>
    <line x1="592" y1="172" x2="838" y2="172" stroke="#44565e"/>
    <text x="592" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Full-stack web</text>
    <text x="592" y="216" font-family="monospace" font-size="10" fill="#9bb0a5">Node.js · Express · SQLite · JS</text>
    <line x1="592" y1="228" x2="838" y2="228" stroke="#44565e"/>
    <text x="592" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d8e3dc">Payments, auth &amp; REST APIs</text>
  </g>
  <g class="fade d4">
    <text x="40" y="302" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f3e46">Software Engineering · Student Developer</text>
    <rect x="640" y="284" width="220" height="26" rx="13" fill="#dcebe0"/>
    <circle class="br" cx="658" cy="297" r="4" fill="#4c9a6a"/>
    <text x="672" y="301" font-family="monospace" font-size="11" fill="#2d4a38">Open to internships</text>
  </g>
</svg>
