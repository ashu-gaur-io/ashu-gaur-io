<svg viewBox="0 0 820 382" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.l{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
</style>
<rect width="820" height="382" rx="14" fill="#0d1117" stroke="#30363d"/>
<circle cx="26" cy="26" r="6" fill="#e8a077"/><circle cx="46" cy="26" r="6" fill="#b9c4cc"/><circle cx="66" cy="26" r="6" fill="#6b7780"/>
<text x="410" y="30" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">ashutosh@mumbai: ~</text>
<text class="l" style="animation-delay:0.40s" x="40" y="75" font-family="monospace" font-size="15" fill="#9ec5ff">$ whoami</text>
<text class="l" style="animation-delay:0.85s" x="40" y="101" font-family="monospace" font-size="15" fill="#e6edf3">Ashutosh Gaur — Software Engineering student</text>
<text class="l" style="animation-delay:1.30s" x="40" y="127" font-family="monospace" font-size="15" fill="#9ec5ff">$ cat about.txt</text>
<text class="l" style="animation-delay:1.75s" x="40" y="153" font-family="monospace" font-size="15" fill="#e6edf3">I solve problems in C++ and build full-stack web apps.</text>
<text class="l" style="animation-delay:2.20s" x="40" y="179" font-family="monospace" font-size="15" fill="#e6edf3">I like turning an idea into something people can actually use.</text>
<text class="l" style="animation-delay:2.65s" x="40" y="205" font-family="monospace" font-size="15" fill="#9ec5ff">$ cat education.txt</text>
<text class="l" style="animation-delay:3.10s" x="40" y="231" font-family="monospace" font-size="15" fill="#e8a077">YOUR COLLEGE · YOUR BRANCH · Class of 20XX</text>
<text class="l" style="animation-delay:3.55s" x="40" y="257" font-family="monospace" font-size="15" fill="#9ec5ff">$ cat building.txt</text>
<text class="l" style="animation-delay:4.00s" x="40" y="283" font-family="monospace" font-size="15" fill="#e8a077">Aromea Cafe — ordering, Razorpay payments &amp; table booking</text>
<text class="l" style="animation-delay:4.45s" x="40" y="309" font-family="monospace" font-size="15" fill="#9ec5ff">$ echo $BASE</text>
<text class="l" style="animation-delay:4.90s" x="40" y="335" font-family="monospace" font-size="15" fill="#e6edf3">Mumbai, India</text>
<text class="l" style="animation-delay:5.35s" x="40" y="361" font-family="monospace" font-size="15" fill="#9ec5ff">$ </text>
<rect class="cur" x="62" y="348" width="9" height="17" fill="#e6edf3"/>
</svg>